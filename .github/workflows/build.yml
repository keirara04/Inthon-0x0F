# Builds both Docker images on every PR (as a check) and pushes them to GHCR on main.
# Images: ghcr.io/<owner>/<repo>-frontend and ghcr.io/<owner>/<repo>-backend (lowercased)
name: Build containers

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public API URL is baked into the frontend at build time. Set it in
          # repo Settings > Secrets and variables > Actions > Variables.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Tell Dokploy to pull the new image via its API. Only /api/application.deploy is
      # exposed publicly (Cloudflare tunnel route). Skips quietly until secrets are set.
      - name: Trigger Dokploy deploy
        if: github.event_name != 'pull_request'
        env:
          API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APP_ID: ${{ matrix.app == 'backend' && secrets.DOKPLOY_BACKEND_APP_ID || secrets.DOKPLOY_FRONTEND_APP_ID }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$APP_ID" ]; then echo "Dokploy secrets not set, skipping deploy"; exit 0; fi
          curl -fsS -X POST https://inthon-deploy.hakeemiridza.com/api/application.deploy \
            -H "x-api-key: $API_KEY" -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP_ID\"}"
